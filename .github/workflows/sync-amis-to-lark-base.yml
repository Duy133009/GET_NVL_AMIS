name: Sync AMIS To Lark Base

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate required secrets
        env:
          MISA_ACCESS_CODE: ${{ secrets.MISA_ACCESS_CODE }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_APP_TOKEN: ${{ secrets.LARK_BASE_APP_TOKEN }}
          LARK_TABLE_ID: ${{ secrets.LARK_TABLE_ID }}
        run: |
          $required = @(
            'MISA_ACCESS_CODE',
            'LARK_APP_ID',
            'LARK_APP_SECRET',
            'LARK_BASE_APP_TOKEN',
            'LARK_TABLE_ID'
          )
          $missing = @()
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error ("Thiếu GitHub Secrets: " + ($missing -join ', '))
          }

      - name: Run sync
        env:
          MISA_ACCESS_CODE: ${{ secrets.MISA_ACCESS_CODE }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_APP_TOKEN: ${{ secrets.LARK_BASE_APP_TOKEN }}
          LARK_TABLE_ID: ${{ secrets.LARK_TABLE_ID }}
        run: node scripts/sync-amis-to-lark-base.mjs
